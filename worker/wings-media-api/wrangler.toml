name = "wings-media-api"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true
# Matches the Worker's existing dashboard setting; preview URLs stay off.
preview_urls = false

# Non-secret configuration only. The Tigris keys are Worker secrets:
#   wrangler secret put TIGRIS_ACCESS_KEY_ID
#   wrangler secret put TIGRIS_SECRET_ACCESS_KEY
[vars]
FIREBASE_PROJECT_ID = "wings-50acb"
TIGRIS_BUCKET = "wings-media"
TIGRIS_ENDPOINT = "https://t3.storage.dev"
TIGRIS_REGION = "auto"

# Exposes the running version id/timestamp to /health so a deployment can be
# verified from the outside without reading the Cloudflare dashboard.
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
