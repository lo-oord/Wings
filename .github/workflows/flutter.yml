name: Flutter CI

on:
  push:
    branches: [main, "wings/**", "freebuff/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Maven Central and the Gradle plugin portal occasionally answer a shared
      # runner IP with 429 "Too Many Requests". Gradle retries a repository by
      # default only three times with a very short backoff, which is not enough
      # for that case; these settings give it a longer, still bounded, retry.
      GRADLE_OPTS: >-
        -Dorg.gradle.internal.repository.max.retries=8
        -Dorg.gradle.internal.repository.initial.backoff=2000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # Caches ~/.gradle between runs, so a re-run does not have to download the
      # Kotlin/Android artifacts again (the step that failed with HTTP 429).
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is missing; release artifacts will use the debug keystore."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/wings-upload.jks
          cat > android/key.properties <<PROPS
          storeFile=app/wings-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
          keytool -list -v -keystore android/app/wings-upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build per-architecture release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: wings-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: wings-apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: wings-apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: wings-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: wings-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # The in-app updater downloads the APK from this release, so the release
      # is created (or refreshed) for every version published on main.
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          TAG="v$VERSION"
          NOTES="docs/release-notes/$TAG.md"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          cp "$APK" "wings-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Wings $VERSION" --notes-file "$NOTES"
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "Wings $VERSION" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "Wings $VERSION" --generate-notes
          fi
          gh release upload "$TAG" "wings-$VERSION.apk" --clobber
